# OpenSSF Scorecard: a report on the repository's supply-chain security (branch protection,
# pinned actions, token permissions, …). Optional: it runs only when started by hand
# (Actions → Scorecard → Run workflow) and never blocks anything.
#
# On a private repository GITHUB_TOKEN cannot run its GraphQL queries, so it needs a
# fine-grained read-only token in the SCORECARD_TOKEN secret; without one the run is skipped.
# The SARIF report is always attached to the run; it goes to code scanning only when the
# repository is public (private code scanning needs GitHub Advanced Security).
name: Scorecard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - id: gate
        env:
          PRIVATE: ${{ github.event.repository.private }}
          HAS_TOKEN: ${{ secrets.SCORECARD_TOKEN != '' }}
        run: |
          if [ "$PRIVATE" = true ] && [ "$HAS_TOKEN" != true ]; then
            echo "::notice::Private repository without a SCORECARD_TOKEN secret: Scorecard skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.run == 'true'
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          # The public OpenSSF API and badge accept public repositories only.
          publish_results: ${{ !github.event.repository.private }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
      - if: steps.gate.outputs.run == 'true' && !github.event.repository.private
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
