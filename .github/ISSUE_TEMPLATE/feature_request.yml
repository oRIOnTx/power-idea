name: Feature request
description: Suggest an idea or a JetBrains feature to bring over
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mention the JetBrains equivalent and shortcut if there is one.
