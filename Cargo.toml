[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-languages"] }
anyhow = "1"
alacritty_terminal = "=0.26.0"
ignore = "=0.4.34"
nucleo-matcher = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
