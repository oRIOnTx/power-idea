[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.dependencies]
gpui-kit = { version = "=0.10.0", features = ["tree-sitter-languages"] }
anyhow = "1"
alacritty_terminal = "=0.26.0"
ignore = "=0.4.34"
nucleo-matcher = "=0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "=0.97.0"
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "mysql", "sqlite"] }
redis = { version = "=1.8.2", default-features = false }
futures-core = "=0.3.34"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }
notify = { version = "=8.2.2", default-features = false, features = ["macos_fsevent"] }
toml = "1"
dirs = "7"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
cloned_instead_of_copied = "warn"
needless_collect = "warn"
implicit_clone = "warn"
large_types_passed_by_value = "warn"
inefficient_to_string = "warn"
map_unwrap_or = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
