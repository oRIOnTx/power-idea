<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dark tile -->
  <rect x="104" y="104" width="816" height="816" rx="180" fill="#0f1826" stroke="#1e2a40" stroke-width="4"/>

  <!-- Stacked window outlines; filled with the tile color to hide the one behind; dimmed colors are
       pre-blended because sips ignores stroke-opacity -->
  <g fill="#0f1826" stroke="#5eead4" stroke-width="16">
    <rect x="300" y="192" width="464" height="464" rx="70" stroke="#2b5c5c"/>
    <rect x="260" y="252" width="464" height="464" rx="70" stroke="#40998f"/>
    <rect x="220" y="312" width="464" height="464" rx="70"/>
  </g>

  <!-- "P" -->
  <path d="M336 702V412H472A80 80 0 0 1 472 572H336" fill="none" stroke="#5eead4" stroke-width="60"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cursor -->
  <rect x="500" y="660" width="104" height="36" rx="10" fill="#a78bfa"/>
</svg>
